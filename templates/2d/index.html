<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cosmos · Generic 2D</title>
    <style>
      * { box-sizing: border-box; }
      body { margin: 0; background: #111a26; color: #eef4ff; font: 16px/1.5 system-ui, sans-serif; }
      main { width: min(880px, 100%); margin: 36px auto; padding: 0 24px; }
      h1 { margin: 0; font-size: 28px; }
      .eyebrow { color: #81e4cb; font-size: 12px; letter-spacing: 0.14em; text-transform: uppercase; }
      .instructions { color: #adbed2; margin: 8px 0 24px; }
      #game { width: 100%; aspect-ratio: 8 / 5; }
      canvas { display: block; border-radius: 12px; }
      details { margin-top: 20px; padding: 12px 16px; border: 1px solid #324056; border-radius: 8px; color: #adbed2; }
      pre { overflow-wrap: anywhere; white-space: pre-wrap; font-size: 12px; }
    </style>
  </head>
  <body>
    <main>
      <p class="eyebrow">Cosmos / generic platform template</p>
      <h1>A small stage for your next idea</h1>
      <p class="instructions">Click the sprite to change its color. Click the stage to move it. Try the scene button.</p>
      <div id="game" aria-label="Interactive 2D playground"></div>
      <details open>
        <summary>Read-only scene observation</summary>
        <pre data-testid="debug-state" aria-live="polite">Waiting for the first frame…</pre>
      </details>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
